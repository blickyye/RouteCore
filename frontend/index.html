<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f6f8" />
  <title>RouteCore — доставка без лишнего</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" aria-label="RouteCore главная"><span class="brand-mark"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 9.5 16 4l9 5.5v13L16 28l-9-5.5z"/><path d="m7.5 9.8 8.5 5.1 8.5-5.1M16 15v12"/></svg></span><span>route<span class="brand-light">core</span></span></a>
      <div class="sidebar-label">РАБОЧЕЕ ПРОСТРАНСТВО</div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-bottom">
        <div class="help-card"><div class="help-icon">✦</div><strong>Всё под контролем</strong><p>От создания заказа до его доставки — в одном месте.</p></div>
        <div class="profile-row"><div class="avatar" id="avatar">RC</div><div class="profile-info"><strong id="profile-name">Гость</strong><span id="profile-role">Войдите в аккаунт</span></div><button class="icon-button hidden" id="logout-btn" title="Выйти" aria-label="Выйти">↗</button></div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar"><button class="icon-button mobile-menu" id="mobile-menu" aria-label="Открыть меню">☰</button><div class="breadcrumbs"><span>RouteCore</span><span class="crumb-sep">/</span><strong id="page-crumb">Обзор</strong></div><div class="topbar-right"><span class="connection-dot"></span><span class="connection-label">Сервис доставки</span><button class="top-avatar" id="top-avatar">G</button></div></header>
      <section class="page-content" id="page-content"></section>
      <footer class="footer"><span>© 2026 RouteCore</span><span>Доставка, организованная проще.</span></footer>
    </main>
  </div>
  <div class="toast-region" id="toast-region" aria-live="polite"></div>
  <dialog id="auth-dialog" class="modal"><form method="dialog" class="modal-close-form"><button class="icon-button" aria-label="Закрыть">×</button></form><div id="auth-content"></div></dialog>
  <dialog id="order-dialog" class="modal"><form method="dialog" class="modal-close-form"><button class="icon-button" aria-label="Закрыть">×</button></form><div id="order-content"></div></dialog>
  <script src="app.js"></script>
</body>
</html>
